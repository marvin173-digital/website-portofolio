<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marvin Purnama — Portfolio</title>
<style>
  /* Variabel & Dasar */
  :root {
    --bg: #000;
    --text: #e8e8ea;
    --mute: #8d9097;
    --card: color-mix(in srgb, var(--bg), var(--text) 7%);
    --line: color-mix(in srgb, var(--bg), var(--text) 16%);
    --accent: #e5383b;
    --blue: #3b82f6;
    --green: #22c55e;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
 
  html {
    scroll-behavior: smooth;
    scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px);
  }
 
  * {
    box-sizing: border-box;
  }
 
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 "Inter", system-ui, sans-serif;
  }
 
  a {
    color: inherit;
    text-decoration: none;
  }
 
  /* Navigasi */
  nav {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1000px;
    margin: 12px auto;
    padding: 10px 18px;
    background: color-mix(in srgb, var(--card) 85%, transparent);
    backdrop-filter: blur(10px);
    border-radius: 999px;
    border: 1px solid var(--line);
  }
 
  .logo {
    font-weight: 700;
    color: var(--accent);
  }
 
  .logo i {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 3px;
    animation: dot 1.8s ease-in-out infinite;
  }
 
  .logo i:nth-child(2) { animation-delay: .15s; }
  .logo i:nth-child(3) { animation-delay: .3s; }
 
  .logo:hover i {
    animation-duration: .7s;
  }
 
  @keyframes dot {
    0%, 55%, 100% { transform: translateY(0) scale(1); }
    25%           { transform: translateY(-4px) scale(1.25); }
  }
 
  @media (prefers-reduced-motion: reduce) {
    .logo i { animation: none; }
  }
 
  nav ul {
    display: flex;
    gap: 6px;
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-x: auto;
  }
 
  nav li a {
    display: block;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: var(--mute);
    white-space: nowrap;
  }
 
  nav li a.on,
  nav li a:hover {
    background: var(--text);
    color: var(--bg);
  }
 
  /* Section & Hero */
  section {
    max-width: 1000px;
    margin: 0 auto;
    padding: 56px 20px;
    border-bottom: 1px solid var(--line);
  }
 
  h2 {
    font-size: 22px;
    margin: 0 0 24px;
  }
 
  #hero {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 32px;
    align-items: center;
    background:
      radial-gradient(500px 300px at 0% 30%, rgba(34, 197, 94, .18), transparent),
      radial-gradient(500px 300px at 100% 100%, rgba(59, 130, 246, .2), transparent);
    max-width: none;
    padding-left: max(20px, calc((100% - 960px) / 2));
    padding-right: max(20px, calc((100% - 960px) / 2));
  }
 
  #hero h1 {
    font-size: clamp(40px, 8vw, 64px);
    margin: 0 0 12px;
    letter-spacing: 1px;
  }
 
  .photo {
    aspect-ratio: 1;
    border-radius: 12px;
    background: #2a0b0d center/cover;
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    color: var(--mute);
    font-size: 12px;
    text-align: center;
  }
 
  /* Kontak */
  .contacts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 20px;
  }
 
  .contacts a {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 10px;
    padding: 12px;
    font-size: 12px;
    transition: .2s;
  }
 
  .contacts a:hover {
    border-color: var(--blue);
    transform: translateY(-2px);
  }
 
  .contacts b {
    display: block;
    font-size: 13px;
  }
 
  .contacts span {
    color: var(--mute);
    word-break: break-all;
  }
 
  /* Layout Dua Kolom & Item */
  .two {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }
 
  .item {
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
 
  .item b {
    display: block;
  }
 
  .item small {
    color: var(--mute);
  }
 
  .grp {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--mute);
    margin: 20px 0 8px;
    font-weight: 700;
  }
 
  /* Chips */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
 
  .chip {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    transition: .2s;
  }
 
  .chip:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
 
  /* Proyek */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }
 
  .proj {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: .2s;
  }
 
  .proj:hover {
    border-color: var(--blue);
    transform: translateY(-3px);
  }
 
  .proj .img {
    aspect-ratio: 16/9;
    background: var(--line) center/cover;
    display: grid;
    place-items: center;
    color: var(--mute);
    font-size: 12px;
  }
 
  .proj .body {
    padding: 14px;
  }
 
  .proj h3 {
    font-size: 14px;
    margin: 0 0 10px;
  }
 
  .proj:not(.cert) .img {
    background-position: left top;
  }
 
  .cert .img {
    aspect-ratio: 3/2;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }
 
  /* Tombol */
  .btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
 
  .btn {
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
  }
 
  .btn.g {
    background: var(--green);
    color: #000 !important;
    border-color: var(--green);
    font-weight: 600;
  }
 
  .f {
    cursor: pointer;
    font: inherit;
    color: var(--text);
    transition: .2s;
  }
 
  .f.on {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
 
  .cv {
    display: inline-block;
    margin-top: 16px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
    transition: .2s;
  }
 
  .cv:hover {
    transform: translateY(-2px);
  }
 
  /* Panel */
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 18px;
  }
 
  .panel h3 {
    margin: 0 0 12px;
    font-size: 16px;
  }
 
  /*  Modal */
  #modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .7);
    backdrop-filter: blur(6px);
    display: none;
    place-items: center;
    z-index: 20;
    padding: 16px;
  }
 
  #modal.open {
    display: grid;
  }
 
  .mbox {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    max-width: 760px;
    width: 100%;
    max-height: 90vh;
    overflow: auto;
    padding: 20px;
    position: relative;
  }
 
  .mbox .img {
    aspect-ratio: 16/9;
    background: var(--line) center/cover;
    border-radius: 8px;
    margin: 12px 0;
  }
 
  .x {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: 0;
    color: var(--mute);
    font-size: 22px;
    cursor: pointer;
  }
 
  .mnav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    color: var(--mute);
    font-size: 12px;
  }
 
  .mnav .btn {
    color: var(--text);
    cursor: pointer;
  }
 
  /* Footer */
  footer {
    max-width: 1000px;
    margin: 0 auto;
    padding: 36px 20px;
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 24px;
    font-size: 13px;
    color: var(--mute);
  }
 
  footer h4 {
    color: var(--text);
    margin: 0 0 8px;
  }
 
  footer a {
    display: block;
  }
 
  .copy {
    grid-column: 1/-1;
    text-align: center;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
 
  /* Animasi Reveal */
  .reveal {
    opacity: 0;
    transform: translateY(32px);
    filter: blur(4px);
    transition:
      opacity .7s ease,
      transform .7s cubic-bezier(.2, .7, .2, 1),
      filter .7s ease;
    transition-delay: var(--d, 0ms);
  }
 
  .reveal.in {
    opacity: 1;
    transform: none;
    filter: none;
  }
 
  @media (prefers-reduced-motion: reduce) {
    .reveal {
      opacity: 1;
      transform: none;
      filter: none;
      transition: none;
    }
    html { scroll-behavior: auto; }
  }
 
  .pop {
    animation: pop .4s ease both;
  }
 
  @keyframes pop {
    from { opacity: 0; transform: scale(.96); }
  }
 
  .caret::after {
    content: "\258C";
    color: var(--accent);
    animation: bl 1s steps(1) infinite;
  }
 
  @keyframes bl {
    50% { opacity: 0; }
  }
 
  html.noanim {
    scroll-behavior: auto;
  }
 
  .noanim .reveal {
    opacity: 1;
    transform: none;
    filter: none;
    transition: none;
  }
 
  .noanim * {
    animation: none !important;
  }
 
  /* Pengaturan Tema */
  #theme {
    position: fixed;
    right: 14px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    z-index: 15;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
 
  #themeBtn {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 46px;
    padding: 0 16px;
    border-radius: 999px;
    border: 2px solid var(--text);
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    opacity: 1;
    transition: .2s;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .5);
  }
 
  #themeBtn:hover {
    transform: scale(1.06);
  }
 
  #theme.open #themeBtn {
    background: var(--text);
    color: var(--bg);
  }
 
  #themePanel {
    display: none;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    background: var(--card);
    border: 2px solid var(--text);
    border-radius: 18px;
    padding: 12px 14px;
    max-width: min(92vw, 330px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .55);
  }
 
  #theme.open #themePanel {
    display: flex;
  }
 
  #themePanel button.sw {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--text);
    cursor: pointer;
    padding: 0;
    transition: .2s;
  }
 
  #themePanel button.sw:hover {
    transform: scale(1.15);
  }
 
  #themePanel input {
    width: 36px;
    height: 36px;
    border: 2px solid var(--text);
    border-radius: 8px;
    padding: 0;
    background: none;
    cursor: pointer;
  }
 
  #themePanel .rs {
    background: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 7px 12px;
  }
 
  #themePanel .tx {
    background: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    padding: 3px 8px;
  }
 
  /* Peran & Navigasi Tambahan */
  .role {
    font-size: 12px;
    color: var(--mute);
    margin: -4px 0 10px;
  }
 
  .role b {
    color: var(--text);
    font-weight: 600;
  }
 
  nav ul {
    min-width: 0;
    scrollbar-width: none;
  }
 
  nav ul::-webkit-scrollbar {
    display: none;
  }
 
  /* Pilihan Bahasa */
  .lang {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
    margin-left: 8px;
    padding: 2px 2px 2px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg);
    font-size: 12px;
  }
 
  .lang button {
    border: 0;
    background: none;
    color: var(--mute);
    font: 700 11px/1 inherit;
    padding: 6px 9px;
    border-radius: 999px;
    cursor: pointer;
    transition: .2s;
  }
 
  .lang button:hover {
    color: var(--text);
  }
 
  .lang button.on {
    background: var(--text);
    color: var(--bg);
  }
 
  /* Responsif */
  @media (max-width: 700px) {
    #hero,
    .two,
    footer {
      grid-template-columns: 1fr;
    }
 
    .contacts {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

  <a class="logo" href="#hero"><i style="background:#e5383b"></i><i style="background:#facc15"></i><i style="background:#22c55e"></i><span id="logoText"></span></a>

  <div class="lang" id="langSw" role="group" aria-label="Language / Bahasa"><span aria-hidden="true">🌐</span><button data-l="id">ID</button><button data-l="en">EN</button></div>

  <div>

<section id="about" style="border:0">

  $("filters").innerHTML=["all",...tags].map(f=>`<button class="chip f${f===filter?" on":""}" data-f="${esc(f)}">${f==="all"?t("all"):esc(f)}</button>`).join("");
  shown=DATA.proyek.filter(p=>filter==="all"||p.teknologi.includes(filter));
  $("projList").innerHTML=shown.map((p,i)=>`<div class="proj pop" onclick="openM(${i})">${img(p)}<div class="body"><h3>${esc(L(p.judul))}</h3>${p.peran?`<div class="role">${t("role")}: <b>${esc(L(p.peran))}</b></div>`:""}<div class="btns"><span class="btn">${t("detail")}</span>${p.demo?`<a class="btn" href="${esc(p.demo)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t("demo")}</a>`:""}${p.kode?`<a class="btn" href="${esc(p.kode)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t("code")}</a>`:""}</div></div></div>`).join("");
}
$("filters").onclick=e=>{const f=e.target.dataset.f;if(f){filter=f;renderProjects()}};

function renderCerts(){
  const meta=c=>esc(L(c.penerbit))+(c.tanggal?" · "+esc(L(c.tanggal)):"");
  $("certList").innerHTML=DATA.sertifikat.map((c,i)=>`<div class="proj cert" onclick="openCert(${i})"><div class="img" style="background-image:url('${c.gambar}')"></div><div class="body"><h3>${esc(L(c.judul))}</h3><small style="color:var(--mute)">${meta(c)}</small></div></div>`).join("");
}
function openCert(i){
  mode="cert";curC=i;const c=DATA.sertifikat[i];
  $("mContent").innerHTML=`<small style="color:var(--mute)">${esc(L(c.penerbit))}${c.tanggal?" · "+esc(L(c.tanggal)):""}</small><h3 style="margin:6px 0">${esc(L(c.judul))}</h3><img src="${c.gambar}" alt="${esc(L(c.judul))}" style="width:100%;border-radius:8px;margin:10px 0;background:var(--line)"><p style="color:var(--mute)">${esc(L(c.deskripsi))}</p>`;
  $("modal").classList.add("open");
}
function render(){
  R.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll("[data-s]").forEach((a,i)=>a.textContent=t("menu")[i]);
  document.querySelectorAll("#fLinks a").forEach((a,i)=>{a.textContent=t("menu")[i]});
  $("fDesc").textContent=L(DATA.footerDesc);
  $("copy").textContent=`© ${DATA.tahun}. ${t("rights")}`;
  if(!DATA.foto)$("photo").textContent=t("photo");
  $("cvBtn").style.display=DATA.cv?"":"none";$("cvBtn").href=DATA.cv||"#";$("cvBtn").textContent=t("cv");
  $("eduList").innerHTML=DATA.pendidikan.map(item).join("");
  $("expList").innerHTML=DATA.pengalaman.map(item).join("");
  const hasExp=DATA.pengalaman.length>0;$("expList").parentNode.style.display=hasExp?"":"none";$("education").firstElementChild.style.gridTemplateColumns=hasExp?"":"1fr";
  $("aboutText").innerHTML=DATA.tentang.map(x=>`<p>${esc(L(x))}</p>`).join("");
  $("hobbies").innerHTML=DATA.hobi.map(h=>`<span class="chip">${esc(L(h))}</span>`).join("");
  document.querySelectorAll("#langSw button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));$("rs").textContent=t("reset");$("themeLbl").textContent=t("color");
  renderProjects();renderCerts();
  if($("modal").classList.contains("open")){mode==="cert"?openCert(curC):openM(Math.min(cur,shown.length-1))}
}
function openM(i){
  if(!shown.length)return closeM();
  mode="proj";const n=shown.length,p=shown[i];cur=i;
  $("mContent").innerHTML=`<small style="color:var(--mute)">${esc(L(p.judul))}</small>${p.gambar?`<img src="${p.gambar}" alt="${esc(L(p.judul))}" style="width:100%;border-radius:8px;margin:12px 0;background:var(--line)">`:img(p)}${p.peran?`<p class="role" style="margin:0 0 12px">${t("role")}: <b>${esc(L(p.peran))}</b></p>`:""}<h3>${t("aboutProj")}</h3><p style="color:var(--mute)">${esc(L(p.deskripsi))}</p><h3>${t("tech")}</h3><div class="chips">${p.teknologi.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div><div class="btns" style="margin-top:16px">${p.demo?`<a class="btn g" href="${esc(p.demo)}" target="_blank" rel="noopener">${t("live")}</a>`:""}${p.kode?`<a class="btn" href="${esc(p.kode)}" target="_blank" rel="noopener">${t("src")}</a>`:""}</div>${n>1?`<div class="mnav"><button class="btn" onclick="openM(${(i-1+n)%n})" aria-label="Prev">◀</button><span>${i+1} / ${n}</span><button class="btn" onclick="openM(${(i+1)%n})" aria-label="Next">▶</button></div>`:""}`;
  $("modal").classList.add("open");
}
function closeM(){$("modal").classList.remove("open")}
$("modal").onclick=e=>{if(e.target.id==="modal")closeM()};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeM();
  if($("modal").classList.contains("open")&&mode==="proj"&&shown.length>1){
    if(e.key==="ArrowRight")openM((cur+1)%shown.length);
    if(e.key==="ArrowLeft")openM((cur-1+shown.length)%shown.length);
  }
});

/* Efek mengetik pada intro */
function setIntro(){clearInterval(tIv);$("intro").classList.remove("caret");$("intro").style.minHeight="";$("intro").textContent=L(DATA.intro)}
function typeIntro(){
  const el=$("intro"),full=L(DATA.intro);
  setIntro();
  if(R.classList.contains("noanim")||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  el.style.minHeight=el.offsetHeight+"px";el.textContent="";el.classList.add("caret");
  let i=0;tIv=setInterval(()=>{i+=2;el.textContent=full.slice(0,i);if(i>=full.length)setIntro()},18);
}

/* Tombol bahasa & animasi */
$("langSw").onclick=e=>{const l=e.target.dataset.l;if(!l||l===lang)return;lang=l;try{localStorage.setItem("lang",lang)}catch(x){}render();setIntro()};
$("animBtn").onclick=()=>{const off=R.classList.toggle("noanim");try{localStorage.setItem("anim",off?"off":"on")}catch(e){}$("animBtn").style.opacity=off?.4:1;if(off)setIntro()};
$("animBtn").style.opacity=R.classList.contains("noanim")?.4:1;

render();typeIntro();

/* Ganti warna latar */
(function(){
  const R=document.documentElement,K="bgColor",presets=["#000000","#0b1220","#1a0b0d","#0d1a12","#f4f1ea"];
  const apply=c=>{
    const n=parseInt(c.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,light=(0.299*r+0.587*g+0.114*b)>150;
    R.style.setProperty("--bg",c);
    R.style.setProperty("--text",light?"#17181a":"#e8e8ea");
    R.style.setProperty("--mute",light?"#5d6168":"#8d9097");
    $("colorPick").value=c;
  };
  const save=c=>{try{localStorage.setItem(K,c)}catch(e){}};
  $("swatches").innerHTML=presets.map(c=>`<button class="sw" style="background:${c}" data-c="${c}" aria-label="${c}"></button>`).join("");
  $("swatches").onclick=e=>{const c=e.target.dataset.c;if(c){apply(c);save(c)}};
  $("colorPick").oninput=e=>{apply(e.target.value);save(e.target.value)};
  $("rs").onclick=()=>{["--bg","--text","--mute"].forEach(v=>R.style.removeProperty(v));$("colorPick").value="#000000";try{localStorage.removeItem(K)}catch(e){}};
  $("themeBtn").onclick=()=>$("theme").classList.toggle("open");
  try{const c=localStorage.getItem(K);if(/^#[0-9a-f]{6}$/i.test(c||""))apply(c)}catch(e){}
})();
/* Animasi muncul saat scroll */
(function(){
  const sel="#hero h1,#intro,.contacts a,.photo,section h2,.item,.grp,.chip,.proj,.panel,footer>div";
  const els=[...document.querySelectorAll(sel)];
  els.forEach(el=>{
    const sibs=[...el.parentNode.children].filter(c=>c.matches(sel));
    el.style.setProperty("--d",Math.min(sibs.indexOf(el),8)*80+"ms"); // jeda antar elemen
    el.classList.add("reveal");
  });
  if(!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("in"));return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}
  }),{threshold:.12,rootMargin:"0px 0px -6% 0px"});
  els.forEach(e=>io.observe(e));
})();
const links=[...document.querySelectorAll("[data-s]")];
new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(l=>l.classList.toggle("on",l.dataset.s===e.target.id))}),{rootMargin:"-40% 0px -55% 0px"}).observe&&
(o=>menu.forEach(m=>o.observe($(m[0]))))(new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(l=>l.classList.toggle("on",l.dataset.s===e.target.id))}),{rootMargin:"-40% 0px -55% 0px"}));
</script>
</body>
</html>
